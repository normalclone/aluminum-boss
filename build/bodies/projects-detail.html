<div id="ab-detail"></div>
<div class="ab-viewer" id="ab-viewer" hidden role="dialog" aria-modal="true" aria-label="Gallery viewer">
  <button class="ab-v-close" type="button" aria-label="Close gallery">&times;</button>
  <button class="ab-v-prev" type="button" aria-label="Previous photograph">&#8592;</button>
  <button class="ab-v-next" type="button" aria-label="Next photograph">&#8594;</button>
  <figure class="ab-v-stage">
    <img id="ab-v-img" alt="">
    <figcaption><span id="ab-v-cap"></span><span class="ab-v-count" id="ab-v-count"></span></figcaption>
  </figure>
</div>
