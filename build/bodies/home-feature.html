<style>
/* One full-width panel: a photograph with the offer written across it. The theme's own
   core-cta-customizable holds the structure; everything below is the variant that turns its
   side-by-side text and image into an overlay, because the copy has to sit on the photograph
   rather than beside it.
   Full-bleed on the page's own grid: the shared parent insets its children by 38px, so the
   band pulls back by exactly that much and no more. Below 1024 the inset is smaller, and the
   same negative margin would push the panel past the right edge of the viewport - so it
   stops, and the panel sits in normal flow. */
.abfc{--abfc-bleed:38px}
.abfc *{box-sizing:border-box}
.abfc .abfc-band{margin-left:calc(-1 * var(--abfc-bleed));margin-right:calc(-1 * var(--abfc-bleed));
  padding:clamp(40px,4vw,72px) 0}
.abfc .abfc-cta{position:relative;flex-direction:row;align-items:stretch;
  justify-content:flex-start;
  margin:0;width:auto;max-width:none;height:auto;min-height:clamp(400px,36vw,560px);
  overflow:hidden;background:#1d1d1b}
/* The image stops being a column and becomes the ground the panel is drawn on. */
.abfc .abfc-cta .core-cta-customizable__image-col{position:absolute;top:0;left:0;
  width:100%;height:100%;flex:none;z-index:0}
.abfc .abfc-cta .core-cta-customizable__image-col__image{position:absolute;top:0;left:0;
  width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:center}
/* White on a photograph is a gamble, so the panel does not take it: a scrim heavy enough to
   hold the type at 4.5:1 over the mid-grey placeholder, thinning out to nothing over the half
   of the frame the text never reaches. */
.abfc .abfc-cta::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(16,16,15,.92) 0%,rgba(16,16,15,.86) 30%,
    rgba(16,16,15,.62) 58%,rgba(16,16,15,.14) 88%,rgba(16,16,15,0) 100%)}
/* The panel runs the full width of the viewport, but its copy still lines up with the
   1280px column the sections above and below are set in: the left padding is whichever is
   larger, the panel's own inset or the distance in to that column. */
.abfc .abfc-cta .core-cta-customizable__text-col{position:relative;z-index:2;
  flex:0 1 62%;max-width:920px;color:#fff;justify-content:flex-end;
  padding:clamp(34px,3.6vw,64px) clamp(22px,3vw,56px);
  padding-left:max(clamp(22px,3vw,56px),62px,calc((100% - 1280px) / 2 + 24px))}
.abfc .abfc-cta .core-cta-customizable__text-col__top{display:block}
.abfc .abfc-cta .core-cta-customizable__text-col__bottom__text{max-width:none;
  margin:0 0 14px;font-size:13px;line-height:1.2;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.74)}
/* font-40 is the theme's own step, but it reaches 53px on a tablet - twice the size of the
   headings either side of this panel. This one is meant to be the loudest thing on the page,
   not a different page. */
.abfc .abfc-cta .core-cta-customizable__text-col__top h2{max-width:18ch;margin:0;
  font-size:clamp(29px,3vw,46px);font-weight:300;line-height:1.04;letter-spacing:-.012em;
  text-shadow:0 2px 30px rgba(0,0,0,.55)}
.abfc .abfc-cta .abfc-text{max-width:46ch;margin:18px 0 0;
  font-size:clamp(15px,1.15vw,18px);line-height:1.6;color:rgba(255,255,255,.88);
  text-shadow:0 1px 18px rgba(0,0,0,.5)}
.abfc .abfc-cta .core-cta-customizable__text-col__bottom{display:flex;flex-wrap:wrap;
  align-items:center;gap:14px 26px;margin-top:clamp(26px,3vw,44px)}
/* .ab a sets colour to inherit, which on this panel is white - and the button is white. */
.abfc .abfc-cta a.btn{color:#1d1d1b;font-size:14px;letter-spacing:.02em}
.abfc .abfc-cta a.abfc-alt{color:#fff;font-size:14px;letter-spacing:.02em;
  text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.abfc .abfc-cta a.abfc-alt:hover{color:rgba(255,255,255,.7)}
/* Narrow: the frame is taller than it is wide, so the scrim turns through 90 degrees and the
   copy sits on the bottom of the photograph instead of the left of it. */
@media (max-width:1024px){
  .abfc .abfc-band{margin-left:0;margin-right:0}
  .abfc .abfc-cta{min-height:520px}
  .abfc .abfc-cta::after{background:linear-gradient(180deg,rgba(16,16,15,.34) 0%,
    rgba(16,16,15,.5) 24%,rgba(16,16,15,.78) 55%,rgba(16,16,15,.92) 100%)}
  /* The band no longer bleeds here, so the copy is measured from the panel's own edge
     again rather than from the 1280px column. */
  .abfc .abfc-cta .core-cta-customizable__text-col{flex:1 1 100%;max-width:none;
    padding-left:clamp(22px,3vw,56px)}
  .abfc .abfc-cta .core-cta-customizable__text-col__top h2{max-width:22ch}
}
@media (max-width:600px){
  .abfc .abfc-band{padding:32px 0}
  .abfc .abfc-cta{min-height:470px}
  .abfc .abfc-cta .core-cta-customizable__text-col__top h2{max-width:none}
  .abfc .abfc-cta .core-cta-customizable__text-col{padding:28px 20px 32px}
  .abfc .abfc-cta .abfc-text{max-width:none}
  .abfc .abfc-cta .core-cta-customizable__text-col__bottom{gap:12px 20px;margin-top:24px}
}
</style>
<div class="ab abfc" id="abfc" data-depth="1">
  <section class="abfc-band" aria-labelledby="abfc-title">
    <div class="core-cta-customizable abfc-cta" id="abfc-cta"></div>
  </section>
</div>
